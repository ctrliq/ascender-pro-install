- name: Set kubeconfig path for tkgi platform
  ansible.builtin.set_fact:
    kubeconfig_path: "{{ TKGI_KUBECONFIG_PATH | default(lookup('env', 'KUBECONFIG'), true) | default(lookup('env', 'HOME') + '/.kube/config', true) }}"

- name: Expand tilde in kubeconfig path
  ansible.builtin.set_fact:
    kubeconfig_path: "{{ kubeconfig_path | regex_replace('^~', lookup('env', 'HOME')) }}"

- name: Get current kubeconfig context for tkgi platform
  ansible.builtin.command:
    argv:
      - kubectl
      - config
      - current-context
      - --kubeconfig={{ kubeconfig_path }}
  register: current_context
  changed_when: false

- name: Set kubeconfig context for tkgi platform
  ansible.builtin.set_fact:
    tkgi_k8s_context: "{{ TKGI_K8S_CONTEXT | default(current_context.stdout, true) }}"

- name: Retrieve the current time in order to timestamp files
  ansible.builtin.setup:
    gather_subset:
     - date_time

- name: Create Namespace
  kubernetes.core.k8s:
    name: "{{ REGISTRY_NAMESPACE }}"
    api_version: v1
    kind: Namespace
    state: present
    context: "{{ tkgi_k8s_context }}"
    kubeconfig: "{{ kubeconfig_path }}"
    verify_ssl: false

- name: Generate manifest to install registry k8s object with timestamp attached, for purposes of deletion later
  ansible.builtin.template:
    src: registry_deployment_tkgi.yml
    dest: "{{ tmp_dir }}/registry_deployment_tkgi.yml.{{ ansible_date_time.iso8601_basic_short }}"

- name: Generate manifest for the Registry registry secret with timestamp, for purposes of deletion later
  when: DEPOT_REGISTRY.BASE is defined
  ansible.builtin.template:
    src: registry_deployment_registry_secret.yml
    dest: "{{ tmp_dir }}/registry_deployment_registry_secret.yml.{{ ansible_date_time.iso8601_basic_short }}"

- name: Apply registry registry secret (if needed) manifest for {{ k8s_platform }}
  when: DEPOT_REGISTRY.BASE is defined
  kubernetes.core.k8s:
    state: present
    namespace: "{{ REGISTRY_NAMESPACE }}"
    definition: "{{ lookup('template', 'templates/registry_deployment_registry_secret.yml') | from_yaml }}"
    verify_ssl: false

- name: "Apply registry manifest for {{ k8s_platform }}"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ REGISTRY_NAMESPACE }}"
    definition: "{{ lookup('template', 'templates/registry_deployment_tkgi.yml') | from_yaml_all }}"
    context: "{{ tkgi_k8s_context }}"
    kubeconfig: "{{ kubeconfig_path }}"
    verify_ssl: false
  register: registry_apply_result

- name: Wait for Registry Deployment to complete setting up
  kubernetes.core.k8s_info:
    kind: Deployment
    wait: yes
    name: ascender-registry
    namespace: "{{ REGISTRY_NAMESPACE }}"
    wait_sleep: 10
    wait_timeout: 360
    context: "{{ tkgi_k8s_context }}"
    kubeconfig: "{{ kubeconfig_path }}"
    verify_ssl: false

- name: Wait for ascender-registry-containers Deployment to complete setting up
  kubernetes.core.k8s_info:
    kind: Deployment
    wait: yes
    name: ascender-registry-containers
    namespace: "{{ REGISTRY_NAMESPACE }}"
    wait_sleep: 10
    wait_timeout: 360
    context: "{{ tkgi_k8s_context }}"
    kubeconfig: "{{ kubeconfig_path }}"
    verify_ssl: false
     
- name: Restart Registry deployments to pull latest image
  kubernetes.core.k8s:
    state: present
    api_version: apps/v1
    kind: Deployment
    name: "ascender-registry"
    namespace: "{{ REGISTRY_NAMESPACE }}"
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ ansible_date_time.iso8601 }}"
    merge_type:
      - strategic-merge
    context: "{{ tkgi_k8s_context }}"
    kubeconfig: "{{ kubeconfig_path }}"
    verify_ssl: false
  when:
    - REGISTRY_VERSION | lower == "latest"
    - not registry_apply_result.changed

- ansible.builtin.debug:
    msg: "The Registry endpoint is {{ k8s_lb_protocol }}://{{ REGISTRY_HOSTNAME }}"

- name: Wait until Registry endpoint is Up
  ansible.builtin.uri:
    url: "{{ k8s_lb_protocol }}://{{ REGISTRY_HOSTNAME }}/"
    return_content: yes
    validate_certs: false
    status_code:
      - 200
  until: uri_output.status == 200
  retries: 200
  delay: 10
  register: uri_output

- ansible.builtin.debug:
    msg: "Registry endpoint is up"
