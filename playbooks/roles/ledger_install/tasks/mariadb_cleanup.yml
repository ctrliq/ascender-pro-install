# Runs once Ledger answers on PostgreSQL after a completed migration: removes the
# MariaDB Deployment and Service of the old install. The MariaDB volume (PVC mysql-data) is
# kept for rollback unless LEDGER_REMOVE_MARIADB_PVC is true, and always kept when no migration
# Job copied it (a migration that was found already done): then nothing proves its data is in
# PostgreSQL.

- name: Stop MariaDB
  kubernetes.core.k8s_scale:
    api_version: apps/v1
    kind: Deployment
    name: db
    namespace: "{{ LEDGER_NAMESPACE }}"
    replicas: 0
    wait: true
    wait_timeout: 300
    context: "{{ ledger_k8s_context | default(omit) }}"
    kubeconfig: "{{ ledger_kubeconfig | default(omit) }}"
    verify_ssl: false
  when: ledger_old_db_deployment.resources | default([]) | length > 0

- name: Remove the MariaDB Deployment and Service
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    name: db
    namespace: "{{ LEDGER_NAMESPACE }}"
    wait: true
    context: "{{ ledger_k8s_context | default(omit) }}"
    kubeconfig: "{{ ledger_kubeconfig | default(omit) }}"
    verify_ssl: false
  loop:
    - {api_version: apps/v1, kind: Deployment}
    - {api_version: v1, kind: Service}
  loop_control:
    label: "{{ item.kind }}/db"

- name: Remove the MariaDB volume
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: PersistentVolumeClaim
    name: mysql-data
    namespace: "{{ LEDGER_NAMESPACE }}"
    context: "{{ ledger_k8s_context | default(omit) }}"
    kubeconfig: "{{ ledger_kubeconfig | default(omit) }}"
    verify_ssl: false
  when:
    - LEDGER_REMOVE_MARIADB_PVC | bool
    - ledger_mariadb_copied | default(false) | bool or ledger_migration_succeeded | default(false) | bool

- name: Explain why the MariaDB volume is kept
  ansible.builtin.debug:
    msg: >-
      LEDGER_REMOVE_MARIADB_PVC is set, but the MariaDB volume (PVC mysql-data) is kept: no
      migration Job copied it (PostgreSQL already held data when the installer looked), so
      nothing proves its data is in PostgreSQL. Check, then delete it with
      kubectl -n {{ LEDGER_NAMESPACE }} delete pvc mysql-data.
  when:
    - LEDGER_REMOVE_MARIADB_PVC | bool
    - ledger_old_db_pvc_present | default(false) | bool
    - not (ledger_mariadb_copied | default(false) | bool or ledger_migration_succeeded | default(false) | bool)

- ansible.builtin.debug:
    msg: >-
      The MariaDB Deployment and Service are removed. The MariaDB volume (PVC mysql-data) is
      kept so you can roll back; once you are satisfied with the migrated Ledger, delete it with
      kubectl -n {{ LEDGER_NAMESPACE }} delete pvc mysql-data, or set LEDGER_REMOVE_MARIADB_PVC: true
      and re-run the installer.
  when:
    - not (LEDGER_REMOVE_MARIADB_PVC | bool)
    - ledger_old_db_pvc_present | default(false) | bool
