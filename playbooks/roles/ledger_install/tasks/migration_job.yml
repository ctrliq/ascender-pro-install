# Runs `ledger-web migrate-from-mariadb` as the Job ledger-mariadb-migration and waits for it.
# Inputs: ledger_migration_source {host, port, name, username, password}, ledger_migration_force.
# The target is LEDGER_DB_*. On success the progress record (ConfigMap
# ledger-postgres-migration) is set to completed; on failure to failed, and the play stops
# with the Job's log.

- name: Remove the Job of an earlier migration attempt
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: ledger-mariadb-migration
    namespace: "{{ LEDGER_NAMESPACE }}"
    delete_options:
      propagationPolicy: Foreground
    wait: true
    wait_timeout: 120
    context: "{{ ledger_k8s_context | default(omit) }}"
    kubeconfig: "{{ ledger_kubeconfig | default(omit) }}"
    verify_ssl: false

- name: Start the migration Job
  kubernetes.core.k8s:
    state: present
    namespace: "{{ LEDGER_NAMESPACE }}"
    definition: "{{ lookup('ansible.builtin.template', 'templates/ledger_migration_job.yaml') | from_yaml_all | list }}"
    context: "{{ ledger_k8s_context | default(omit) }}"
    kubeconfig: "{{ ledger_kubeconfig | default(omit) }}"
    verify_ssl: false
  no_log: true

- ansible.builtin.debug:
    msg: >-
      Copying {{ ledger_migration_source.name }} on {{ ledger_migration_source.host }}:{{ ledger_migration_source.port }}
      to {{ LEDGER_DB_NAME }} on {{ LEDGER_DB_HOST }}:{{ LEDGER_DB_PORT }}{{ ' (--force)' if ledger_migration_force | default(false) | bool else '' }}.
      This can take a while for a large database; follow it with
      kubectl -n {{ LEDGER_NAMESPACE }} logs -f job/ledger-mariadb-migration

- name: Wait for the migration Job to finish
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    name: ledger-mariadb-migration
    namespace: "{{ LEDGER_NAMESPACE }}"
    context: "{{ ledger_k8s_context | default(omit) }}"
    kubeconfig: "{{ ledger_kubeconfig | default(omit) }}"
    verify_ssl: false
  register: ledger_migration_job
  until: >-
    ledger_migration_job.resources | length > 0
    and ((ledger_migration_job.resources[0].status.succeeded | default(0)) > 0
         or (ledger_migration_job.resources[0].status.failed | default(0)) > 0
         or (ledger_migration_job.resources[0].status.conditions | default([])
             | selectattr('type', 'in', ['Complete', 'Failed'])
             | selectattr('status', 'equalto', 'True') | list | length > 0))
  retries: "{{ ((LEDGER_MIGRATION_TIMEOUT | default(7200) | int) / 10) | round(0, 'ceil') | int + 6 }}"
  delay: 10
  failed_when: false

- name: Find the migration pod
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ LEDGER_NAMESPACE }}"
    label_selectors:
      - job-name=ledger-mariadb-migration
    context: "{{ ledger_k8s_context | default(omit) }}"
    kubeconfig: "{{ ledger_kubeconfig | default(omit) }}"
    verify_ssl: false
  register: ledger_migration_pods

- name: Read the migration log
  kubernetes.core.k8s_log:
    namespace: "{{ LEDGER_NAMESPACE }}"
    name: "{{ (ledger_migration_pods.resources | sort(attribute='metadata.creationTimestamp') | last).metadata.name }}"
    context: "{{ ledger_k8s_context | default(omit) }}"
    kubeconfig: "{{ ledger_kubeconfig | default(omit) }}"
    verify_ssl: false
  register: ledger_migration_log
  when: ledger_migration_pods.resources | length > 0
  failed_when: false

- name: Save the migration log next to the manifests
  ansible.builtin.copy:
    content: "{{ ledger_migration_log.log | default('(no log: the migration pod was not found)') }}"
    dest: "{{ tmp_dir }}/ledger-mariadb-migration.{{ ansible_date_time.iso8601_basic_short }}.log"
    mode: "0600"

- name: Show the migration log
  ansible.builtin.debug:
    var: ledger_migration_log.log_lines | default([])

- name: Work out how the migration ended
  ansible.builtin.set_fact:
    ledger_migration_succeeded: >-
      {{ ledger_migration_job.resources | length > 0
         and (ledger_migration_job.resources[0].status.succeeded | default(0)) > 0 }}

- name: Record the migration result
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ledger-postgres-migration
        namespace: "{{ LEDGER_NAMESPACE }}"
      data:
        phase: "{{ 'completed' if ledger_migration_succeeded | bool else 'failed' }}"
        source: "{{ ledger_migration_source.host }}:{{ ledger_migration_source.port }}/{{ ledger_migration_source.name }}"
        target: "{{ LEDGER_DB_HOST }}:{{ LEDGER_DB_PORT }}/{{ LEDGER_DB_NAME }}"
        finished_at: "{{ ansible_date_time.iso8601 }}"
        mariadb_backup: "{{ ledger_mariadb_backup_local | default('') }}"
    context: "{{ ledger_k8s_context | default(omit) }}"
    kubeconfig: "{{ ledger_kubeconfig | default(omit) }}"
    verify_ssl: false

- name: Remove the migration Secret (it holds the source password)
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: ledger-mariadb-migration
    namespace: "{{ LEDGER_NAMESPACE }}"
    context: "{{ ledger_k8s_context | default(omit) }}"
    kubeconfig: "{{ ledger_kubeconfig | default(omit) }}"
    verify_ssl: false

- name: Stop on a failed migration
  ansible.builtin.fail:
    msg: |-
      The MariaDB -> PostgreSQL migration did not succeed{{ ' (the Job did not finish within ' ~ LEDGER_MIGRATION_TIMEOUT ~ 's)' if ledger_migration_job.resources | default([]) | length > 0 and (ledger_migration_job.resources[0].status.failed | default(0)) == 0 else '' }}.
      Last lines of the log ({{ tmp_dir }}/ledger-mariadb-migration.{{ ansible_date_time.iso8601_basic_short }}.log):
      {% for line in (ledger_migration_log.log_lines | default(['(no log)']))[-25:] %}
        {{ line }}
      {% endfor %}

      Nothing points at PostgreSQL yet: Secret db-settings is unchanged and the MariaDB Deployment
      and volume are still there. Ledger's web and parser Deployments are scaled to 0.
      {{ ('MariaDB backup taken before the copy: ' ~ ledger_mariadb_backup_local) if ledger_mariadb_backup_local is defined else '' }}
      Fix the cause and re-run the installer (an unfinished copy is overwritten automatically),
      or roll back as described in docs/configuration/ledger.md.
  when: not (ledger_migration_succeeded | bool)

- ansible.builtin.debug:
    msg: "MariaDB -> PostgreSQL migration completed."
