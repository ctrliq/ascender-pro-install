# OpenShift: the web, parser, scheduler and MCP pods run under the Ledger service account, which
# is bound to the privileged and anyuid SCCs. The PostgreSQL pod does not use it and runs under
# restricted-v2 with an assigned UID.

- name: Grant privileged SCC to '{{ ledger_service_account_name }}' service account
  kubernetes.core.k8s:
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    name: privileged-scc-{{ ledger_service_account_name }}-binding
    state: present
    definition:
      metadata:
        name: privileged-scc-{{ ledger_service_account_name }}-binding
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:openshift:scc:privileged
      subjects:
        - kind: ServiceAccount
          name: "{{ ledger_service_account_name }}"
          namespace: "{{ LEDGER_NAMESPACE }}"

- name: Grant anyuid SCC to '{{ ledger_service_account_name }}' service account
  kubernetes.core.k8s:
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    name: anyuid-scc-{{ ledger_service_account_name }}-binding
    state: present
    definition:
      metadata:
        name: anyuid-scc-{{ ledger_service_account_name }}-binding
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:openshift:scc:anyuid
      subjects:
        - kind: ServiceAccount
          name: "{{ ledger_service_account_name }}"
          namespace: "{{ LEDGER_NAMESPACE }}"
