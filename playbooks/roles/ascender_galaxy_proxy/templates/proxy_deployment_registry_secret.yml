apiVersion: v1
kind: Secret
metadata:
  name: proxy-registry-secret
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ {
    "auths": {
      DEPOT_REGISTRY.BASE: {
        "auth": (DEPOT_REGISTRY.USERNAME ~ ":" ~ DEPOT_REGISTRY.PASSWORD) | b64encode
      }
    }
  } | to_json | b64encode }}
