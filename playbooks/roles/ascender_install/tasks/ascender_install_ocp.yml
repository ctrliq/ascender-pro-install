- name: Retrieve the current time in order to timestamp files
  ansible.builtin.setup:
    gather_subset:
      - date_time

- name: Check that the Ascender custom resources are reachable (namespace-only mode)
  kubernetes.core.k8s_info:
    api_version: "{{ ascender_cr_api_version | default('awx.ansible.com/v1beta1') }}"
    kind: "{{ ascender_cr_kind | default('AWX') }}"
    namespace: "{{ ASCENDER_NAMESPACE }}"
    verify_ssl: false
  register: ocp_cr_check
  failed_when: false
  when: ocp_namespace_only | default(false) | bool

- name: Check that the Ascender operator is running in the namespace (namespace-only mode)
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ ASCENDER_NAMESPACE }}"
    label_selectors:
      - control-plane=controller-manager
    verify_ssl: false
  register: ocp_operator_check
  failed_when: false
  when: ocp_namespace_only | default(false) | bool

- name: Work out what the namespace-only checks found
  ansible.builtin.set_fact:
    # k8s_info reports a missing CRD as success with api_found false, not as a failure
    ocp_cr_unusable: "{{ ocp_cr_check.resources is not defined or not (ocp_cr_check.api_found | default(true) | bool) }}"
    ocp_operator_missing: "{{ (ocp_operator_check.resources | default([]) | length) == 0 }}"
    ocp_cr_error: >-
      {{ (ocp_cr_check.msg | regex_search('[{]"kind":"Status".*?"code":[0-9]+[}]') | from_json).message
         if (ocp_cr_check.msg | default('') | regex_search('[{]"kind":"Status".*?"code":[0-9]+[}]'))
         else (ocp_cr_check.msg | default('') | truncate(300)) }}
  when: ocp_namespace_only | default(false) | bool

- name: Stop with the missing admin steps (namespace-only mode)
  ansible.builtin.fail:
    msg: >-
      {{ (['ocp_namespace_only is true, but the one-time administrator steps are not complete in namespace ' ~ ASCENDER_NAMESPACE ~ '.']
          + (['The Ascender custom resources cannot be used: ' ~ ocp_cr_error ~ '.'] if ocp_cr_unusable | bool else [])
          + (['The Ascender operator is not running in the namespace.'] if ocp_operator_missing | bool else [])
          + ['See "Namespace-only installs" in docs/installation/ocp/README.md.']) | join(' ') }}
  when:
    - ocp_namespace_only | default(false) | bool
    - ocp_cr_unusable | bool or ocp_operator_missing | bool

- name: Create Namespace
  kubernetes.core.k8s:
    name: "{{ ASCENDER_NAMESPACE }}"
    api_version: v1
    kind: Namespace
    verify_ssl: false
    state: present
  when: not (ocp_namespace_only | default(false) | bool)

- name: Generate manifest to install Ascender Operator
  ansible.builtin.template:
    src: templates/ascender-operator/kustomization.j2
    dest: "{{ tmp_dir }}/kustomization.yml"
  when: not (ocp_namespace_only | default(false) | bool)

- name: Generate manifest to install Ascender Operator with timestamp attached, for purposes of operator deletion later
  ansible.builtin.template:
    src: templates/ascender-operator/kustomization.j2
    dest: "{{ tmp_dir }}/kustomization.yml.{{ ansible_date_time.iso8601_basic_short }}"
  when: not (ocp_namespace_only | default(false) | bool)

- name: Copy Operator Source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../offline/ascender-operator-{{ ASCENDER_OPERATOR_VERSION }}/config"
    dest: "{{ tmp_dir }}/"
    remote_src: true
  when:
    - k8s_offline | default(false) | bool
    - not (ocp_namespace_only | default(false) | bool)

- name: Install Ascender Operator with Kustomize
  kubernetes.core.k8s:
    definition: "{{ lookup('kubernetes.core.kustomize', dir=tmp_dir) }}"
    verify_ssl: false
  when: not (ocp_namespace_only | default(false) | bool)

- name: Delete Kustomization file
  ansible.builtin.file:
    path: "{{ tmp_dir }}/kustomization.yml"
    state: absent
  when: not (ocp_namespace_only | default(false) | bool)

- name: Set service account variables
  ansible.builtin.set_fact:
    service_account_name: "ascender-app"

# - name: Remove existing anyuid SCC binding if it exists
#   kubernetes.core.k8s:
#     api_version: rbac.authorization.k8s.io/v1
#     kind: ClusterRoleBinding
#     name: anyuid-scc-{{ service_account_name }}-binding
#     state: absent

- name: Grant anyuid SCC to service account "{{ service_account_name }}"
  kubernetes.core.k8s:
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    name: anyuid-scc-{{ service_account_name }}-binding
    verify_ssl: false
    state: present
    definition:
      metadata:
        name: anyuid-scc-{{ service_account_name }}-binding
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:openshift:scc:anyuid
      subjects:
        - kind: ServiceAccount
          name: "{{ service_account_name }}"
          namespace: "{{ ASCENDER_NAMESPACE }}"
  when: not (ocp_namespace_only | default(false) | bool)

- name: Wait for Operator deployment to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    wait: true
    name: awx-operator-controller-manager
    namespace: "{{ ASCENDER_NAMESPACE }}"
    wait_sleep: 10
    wait_timeout: 360
    verify_ssl: false

- name: Generate manifest to install ascender-app k8s object with timestamp attached, for purposes of deletion later
  ansible.builtin.template:
    src: "ascender-deployment/ascender-deployment-ocp.yml"
    dest: "{{ tmp_dir }}/ascender-deployment-ocp.yml.{{ ansible_date_time.iso8601_basic_short }}"

- name: "Apply ascender-app manifest for {{ k8s_platform }}"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'ascender-deployment/ascender-deployment-ocp.yml') }}"
    verify_ssl: false
  register: ascender_apply_result

- name: Wait for ascender-app-web Deployment to complete setting up (this may take up to 10 minutes)
  kubernetes.core.k8s_info:
    kind: Deployment
    wait: true
    name: ascender-app-web
    namespace: "{{ ASCENDER_NAMESPACE }}"
    wait_sleep: 10
    wait_timeout: 360
    verify_ssl: false

- name: Restart Ascender deployments to pull latest image
  kubernetes.core.k8s:
    state: present
    api_version: apps/v1
    kind: Deployment
    name: "{{ item }}"
    namespace: "{{ ASCENDER_NAMESPACE }}"
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ ansible_date_time.iso8601 }}"
    merge_type:
      - strategic-merge
    verify_ssl: false
  loop:
    - ascender-app-web
    - ascender-app-task
  when:
    - ASCENDER_VERSION | lower == "latest"
    - not ascender_apply_result.changed

- name: Set the Ascender URL
  ansible.builtin.set_fact:
    ascender_ip: "{{ ASCENDER_HOSTNAME }}"
    ascender_port: "443"

- name: Display the Ascender API endpoint
  ansible.builtin.debug:
    msg: "The Ascender API endpoint is https://{{ ascender_ip }}/api/v2/ping/"

- name: Wait until Ascender API is Up (This may take between 10-20 mins)
  ansible.builtin.uri:
    url: "https://{{ ascender_ip }}/api/v2/ping/"
    return_content: true
    validate_certs: false
    status_code:
      - 200
  until:
    - uri_output.status|int == 200
    - uri_output.url == "https://" + ascender_ip + "/api/v2/ping/"
  retries: 200
  delay: 10
  register: uri_output

- name: Display Ascender API status
  ansible.builtin.debug:
    msg: "Ascender API is up"
